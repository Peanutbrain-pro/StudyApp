name: studyapp
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # cupertino_icons removed — CupertinoIcons is never imported in the codebase
  collection: ^1.19.1
  # custom_interactive_viewer removed — never imported anywhere in the codebase
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter_bloc: ^9.1.1
  # flutter_expandable_fab removed — never imported anywhere in the codebase
  forui: ^0.27.4
  go_router: ^18.0.2
  interactive_viewer_2: ^0.1.0
  mobkit_dashed_border: ^0.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  restart_app: ^1.10.1
  shared_preferences: ^2.5.5
  # textf removed — never imported anywhere in the codebase
  # trina_grid removed — never imported anywhere in the codebase
  window_manager: ^0.5.2
  material_ui: ^1.5.0

  super_editor:
    git:
      url: https://github.com/Flutter-Bounty-Hunters/super_editor.git
      path: super_editor
      ref: stable
  pasteboard: ^0.6.2

dependency_overrides:
  super_editor:
    git:
      url: https://github.com/Flutter-Bounty-Hunters/super_editor.git
      path: super_editor
      ref: stable
  super_text_layout:
    git:
      url: https://github.com/Flutter-Bounty-Hunters/super_editor.git
      path: super_text_layout
      ref: stable
  attributed_text:
    git:
      url: https://github.com/Flutter-Bounty-Hunters/super_editor.git
      path: attributed_text
      ref: stable

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  forui_cli: ^0.27.0

flutter:
  uses-material-design: true
  assets:
    - assets/pdf_icon.png
    - assets/fonts/inter/
    - assets/fonts/jetbrains_mono/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Italic-Variable.ttf
          style: italic
